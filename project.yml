# Proyecto de Xcode generado con XcodeGen: `xcodegen generate`

name: Cazaminas

options:
  bundleIdPrefix: com.app-zilla
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: es
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Localización con String Catalog (español base, inglés).
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    # Firma ad hoc: sin cuenta de desarrollador de pago.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

packages:
  CazaminasCore:
    path: CazaminasCore

targets:
  Cazaminas:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: CazaminasCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Cazaminas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.puzzle-games
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 App-Zilla"
        CFBundleLocalizations: [es, en]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.app-zilla.Cazaminas
        PRODUCT_NAME: Cazaminas
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: NO

  CazaminasTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AppTests
    dependencies:
      - target: Cazaminas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.app-zilla.CazaminasTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Cazaminas:
    build:
      targets:
        Cazaminas: all
    run:
      config: Debug
    test:
      config: Debug
      # Los tests comprueban textos en español: se fija el idioma para que den
      # el mismo resultado en cualquier Mac (el de GitHub Actions está en inglés).
      language: es
      region: ES
      targets:
        - CazaminasTests
        - package: CazaminasCore/CazaminasCoreTests
    archive:
      config: Release
