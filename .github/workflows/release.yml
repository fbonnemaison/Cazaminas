# Cazaminas — © 2026 App-Zilla. Licencia MIT.
# Al subir un tag vX.Y.Z: compila, empaqueta (.dmg y .zip con firma ad hoc)
# y publica una release de GitHub con las notas del CHANGELOG.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Comprobar que el tag coincide con la versión
        run: |
          VERSION=$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"/\1/p' project.yml)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "El tag $GITHUB_REF_NAME no coincide con MARKETING_VERSION ($VERSION)" >&2
            exit 1
          fi

      - name: Tests
        run: swift test --package-path CazaminasCore

      - name: Compilar y empaquetar
        run: Tools/Release/build-release.sh

      - name: Notas de la versión
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          cat >> release-notes.md <<'EOF'

          ---

          **Primera vez:** la app no está notarizada (es gratuita y sin cuenta de pago de Apple).
          Ábrela, cierra el aviso y ve a **Ajustes del Sistema › Privacidad y seguridad › Abrir igualmente**.
          EOF

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Cazaminas ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
